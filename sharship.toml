# ~/.config/starship.toml

palette = "catppuccin_macchiato"
add_newline = false

format = """
[](peach)\
$username\
[ ](bg:base fg:peach)\
$directory\
[](fg:base bg:maroon)\
$git_branch\
$rust\
[ ](fg:maroon)\
"""

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[username]
show_always = true
style_user = "bg:peach"
format = '[$user ]($style)'
disabled = false

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
style = "fg:text bg:base"
format = "[󰉋 $path ]($style)"

[git_branch]
symbol = ""
style = "fg:text bg:maroon"
format = "[ $symbol $branch ]($style)"

[nodejs]
disabled = true

[python]
disabled = true

[rust]
symbol = ""
style = "fg:text bg:maroon"
format = '[$symbol ($version) ]($style)'
disabled = false

[golang]
disabled = true

[docker_context]
disabled = true

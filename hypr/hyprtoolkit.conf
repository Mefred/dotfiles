# ~/.config/hyprtoolkit/hyprtoolkit.conf

source=~/.config/hypr/macchiato.conf

[general]
theme = catppuccin_macchiato
blur = true
rounding = 10
animation = true

[ui]
background = $base
foreground = $text
border = $mauve
accent = $mauve
selection = $surface1

[window]
border_size = 2
border_active = $mauve
border_inactive = $surface0
shadow = true
shadow_color = $crust

[buttons]
close = $red
minimize = $yellow
maximize = $green

[terminal]
cursor = $pink
text = $text
background = $mantle
